<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Emerald / Cyan Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shield Glow / Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Container Shield / Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Subtle Blueprint / Grid Geometry -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-dasharray="6 6" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.4"/>
  <line x1="256" y1="88" x2="256" y2="424" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="88" y1="256" x2="424" y2="256" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Outer Interconnected Telemetry Constellation Lines -->
  <g stroke="#38BDF8" stroke-width="3" opacity="0.45">
    <line x1="256" y1="120" x2="376" y2="190"/>
    <line x1="376" y1="190" x2="376" y2="322"/>
    <line x1="376" y1="322" x2="256" y2="392"/>
    <line x1="256" y1="392" x2="136" y2="322"/>
    <line x1="136" y1="322" x2="136" y2="190"/>
    <line x1="136" y1="190" x2="256" y2="120"/>
    
    <!-- Cross links to center -->
    <line x1="136" y1="190" x2="256" y2="256"/>
    <line x1="376" y1="190" x2="256" y2="256"/>
    <line x1="256" y1="392" x2="256" y2="256"/>
  </g>

  <!-- Central Proof Shield & Verified Checkmark -->
  <g filter="url(#glow)">
    <!-- Verified Path (Geometric Checkmark & Target Node) -->
    <path d="M 184 256 L 232 308 L 336 196" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Physical Point Nodes (Telemetry Sensors) -->
  <!-- Top Node -->
  <circle cx="256" cy="120" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="5" filter="url(#nodeGlow)"/>
  <circle cx="256" cy="120" r="6" fill="#38BDF8"/>

  <!-- Top Right Node -->
  <circle cx="376" cy="190" r="14" fill="#0F172A" stroke="#10B981" stroke-width="5"/>
  <circle cx="376" cy="190" r="6" fill="#10B981"/>

  <!-- Bottom Right Node -->
  <circle cx="376" cy="322" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="5"/>
  <circle cx="376" cy="322" r="6" fill="#38BDF8"/>

  <!-- Bottom Node (Anchor) -->
  <circle cx="256" cy="392" r="16" fill="#0F172A" stroke="#10B981" stroke-width="6" filter="url(#nodeGlow)"/>
  <circle cx="256" cy="392" r="7" fill="#6EE7B7"/>

  <!-- Bottom Left Node -->
  <circle cx="136" cy="322" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="5"/>
  <circle cx="136" cy="322" r="6" fill="#38BDF8"/>

  <!-- Top Left Node -->
  <circle cx="136" cy="190" r="14" fill="#0F172A" stroke="#10B981" stroke-width="5"/>
  <circle cx="136" cy="190" r="6" fill="#10B981"/>

  <!-- Center Hub Node -->
  <circle cx="256" cy="256" r="10" fill="#0F172A" stroke="#6EE7B7" stroke-width="4"/>
  <circle cx="256" cy="256" r="4" fill="#6EE7B7"/>
</svg>
